name: 'package-lock.json root validator'

on:
  push:
    branches: [master]
    paths:
      - '**/package-lock.json'
      - '!package-lock.json'
      - '!packages/cli-e2e/npm-shim/package-lock.json'
  pull_request:
    branches: [master]
    paths:
      - '**/package-lock.json'
      - '!package-lock.json'
      - '!packages/cli-e2e/npm-shim/package-lock.json'

permissions:
  contents: read

jobs:
  lockfile-outside-of-root:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - run: exit 1
