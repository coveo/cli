name: 'package-lock.json version validator'

on:
  push:
    branches: [master]
    paths-ignore:
      - 'package-lock.json'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  lockfile-version:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - run: exit 0
