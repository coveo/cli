name: 'package-lock.json version validator'

on:
  push:
    branches: [master]
    paths-ignore:
      - 'package-lock.json'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  lockfile-version:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - run: exit 0
