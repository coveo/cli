name: 'master lock validator'

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - '.git-lock'

permissions:
  contents: read

jobs:
  git-locked:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - run: exit 0
