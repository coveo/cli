name: 'package-lock.json root validator'

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/package-lock.json'
      - '!package-lock.json'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/package-lock.json'
      - '!package-lock.json'

permissions:
  contents: read

jobs:
  lockfile-outside-of-root:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - run: exit 0
